[project]
name = "ai-engineer"
version = "0.1.0"
requires-python = ">=3.12"
description = "MCP-based AI engineering toolkit"
readme = "README.md"
license = { text = "MIT" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=9.0.0",
    "pytest-asyncio>=0.23.0",
    "coverage>=7.0.0",
    "pylint>=4.1.3",
]

[tool.pytest]
addopts = ["-p", "pytest_asyncio"]
asyncio_mode = "auto"

[tool.pylint.messages_control]
disable = [
    "missing-module-docstring",
    "missing-function-docstring",
    "missing-class-docstring",
    "too-few-public-methods",
]

[tool.pylint.basic]
good-names = ["i", "j", "k", "x", "y", "z", "ai", "uv"]

[tool.pylint.formatting]
max-line-length = 120
